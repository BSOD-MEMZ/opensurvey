version: "3.6"

services:
  mongo:
    image: mongo:4
    container_name: opensurvey-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME} # 默认使用系统的环境变量
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD} # 默认使用系统的环境变量
    ports:
      - "27017:27017" # 数据库端口
    volumes:
      - mongo-volume:/data/db
    networks:
      - opensurvey

  opensurvey:
    # 从本仓库就地构建（不再依赖任何外部预构建镜像）
    # 需要带完整构建工具链时把 dockerfile 换成 Dockerfile.full
    build:
      context: .
      dockerfile: Dockerfile
    image: opensurvey:latest
    container_name: opensurvey
    restart: always
    ports:
      - "8080:8080" # 前端页面与 API 端口
    environment:
      OPENSURVEY_MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@opensurvey-mongo:27017
      OPENSURVEY_MONGO_AUTH_SOURCE: ${OPENSURVEY_MONGO_AUTH_SOURCE} # 用 mongo 官方镜像并设置了 ROOT 账号时，默认值是 admin
      OPENSURVEY_MONGO_DB_NAME: ${OPENSURVEY_MONGO_DB_NAME:-opensurvey}
      OPENSURVEY_JWT_SECRET: ${OPENSURVEY_JWT_SECRET:?请先设置 OPENSURVEY_JWT_SECRET}
      OPENSURVEY_RESPONSE_AES_ENCRYPT_SECRET_KEY: ${OPENSURVEY_RESPONSE_AES_ENCRYPT_SECRET_KEY:?请先设置 OPENSURVEY_RESPONSE_AES_ENCRYPT_SECRET_KEY}
      PORT: 8080
    depends_on:
      - mongo
    networks:
      - opensurvey

volumes:
  mongo-volume:

networks:
  opensurvey:
    name: opensurvey
    driver: bridge
